<!doctype html>
<html lang="en">
  <head>
    <!-- Meta charset defines the character encoding for the HTML document -->
    <meta charset="UTF-8" />
    
    <!-- Link to the favicon for the webpage -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Meta viewport tag for responsive design, ensuring proper scaling on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title of the webpage that appears in the browser tab -->
    <title>TravelMate</title>
  </head>
  <body>
    <!-- Root div where the React application will be mounted -->
    <div id="root"></div>
    
    <!-- Script tag to include the main React entry point file -->
    <!-- type="module" indicates that the script is an ES module -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
